name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out backend
        uses: actions/checkout@v4
        with:
          path: ecommerce-backend

      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          repository: bashkimhashani/ecommerce-frontend
          path: ecommerce-frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend lint dependencies
        working-directory: ecommerce-backend
        run: python -m pip install --upgrade pip flake8

      - name: Lint backend with flake8
        working-directory: ecommerce-backend
        run: flake8 .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecommerce-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ecommerce-frontend
        run: npm ci

      - name: Install frontend lint dependencies
        working-directory: ecommerce-frontend
        run: npm install --no-save eslint @eslint/js eslint-plugin-vue globals

      - name: Lint frontend with ESLint
        working-directory: ecommerce-frontend
        run: |
          cat > eslint.config.mjs <<'EOF'
          import js from "@eslint/js";
          import pluginVue from "eslint-plugin-vue";
          import globals from "globals";

          export default [
            {
              ignores: ["dist/**", "node_modules/**"],
            },
            js.configs.recommended,
            ...pluginVue.configs["flat/recommended"],
            {
              files: ["**/*.{js,vue}"],
              languageOptions: {
                ecmaVersion: "latest",
                sourceType: "module",
                globals: {
                  ...globals.browser,
                  ...globals.es2021,
                },
              },
              rules: {
                "vue/multi-word-component-names": "off",
              },
            },
          ];
          EOF
          npx eslint .

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: ecommerce_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Check out backend
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-django pytest-cov

      - name: Run pytest with coverage
        run: python -m pytest --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
